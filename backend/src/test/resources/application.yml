spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false

# Diese Datei ersetzt application.yml im Test vollständig (gleicher Name, Test-Classpath
# gewinnt) — die Finanz-Vorgaben müssen daher hier wiederholt werden.
ntfy:
  base-url: http://localhost:9999
  topic: ""

reminders:
  days-before: 2,1
  hour: 9
  # Im Test nicht von selbst loslaufen
  check-interval-ms: 3600000

finance:
  thresholds:
    svs: 6613.20
    small-business: 55000
  split-basis: GROSS
